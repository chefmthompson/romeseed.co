<style>

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--sans);
  background:linear-gradient(rgba(28,46,33,.88),rgba(17,17,17,.92)),url('/assets/img/hero.jpg') center/cover no-repeat;

}
p{
  font-size:17px;line-height:1.65;
  color:rgba(246,239,227,.82);margin-bottom:40px;
}
.btn{
  display:inline-block;
  background:var(--gold);color:var(--black);
  font-weight:600;font-size:14px;
  letter-spacing:.1em;text-transform:uppercase;
  padding:16px 40px;border-radius:2px;
  text-decoration:none;transition:background .2s ease;

.rule{width:60px;height:1px;background:rgba(246,239,227,.3);margin:44px auto 0}
.tag{
